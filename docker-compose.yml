version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: cecceccio
      MYSQL_DATABASE: levelup
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d